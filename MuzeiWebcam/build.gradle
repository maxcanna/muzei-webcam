apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

def versionMajor = 2
def versionMinor = 6
def versionPatch = 1
def versionBuild = 0

android {
    compileSdk = 37
    namespace = 'net.luxteam.muzeiwebcam'
    buildFeatures.buildConfig = true

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 37
        versionCode versionMajor * 10000 + versionMinor * 1000 + versionPatch * 100 + versionBuild
        versionName "${versionMajor}.${versionMinor}.${versionPatch}"
        multiDexEnabled = true
    }
}

tasks.register('getVersionNumber') {
    def outputFile = file("./versionNumber")
    doLast {
        outputFile.text = "v${versionMajor}.${versionMinor}.${versionPatch}.${versionBuild}"
    }
}

tasks.register('getReleaseNotes', Exec) {
    commandLine 'sh', '-c', "git log --reverse --no-merges --format='- %s' \$(git log --merges --format='%H' -n 2)..HEAD > releaseNotes"
}

dependencies {
    implementation 'com.google.android.apps.muzei:muzei-api:3.4.2'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.firebase:firebase-analytics:23.2.0'
    implementation 'com.google.firebase:firebase-crashlytics:20.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
}
